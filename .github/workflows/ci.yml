name: CI

# Lints, typechecks and builds the site and the server, then builds the
# Docker image to prove it still builds. Nothing is pushed anywhere yet.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: server
      # first, because it generates src/paraglide and the route tree that
      # the typecheck and the type-aware lint need
      - run: npm run build
      - run: npm run typecheck
      - run: npm run typecheck
        working-directory: server
      - run: npm run lint
      - run: npm run fmt:check

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: sebastians-me:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
