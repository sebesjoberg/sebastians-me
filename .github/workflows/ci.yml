name: CI

# Pull requests: lint, typecheck, build, and prove the image still builds.
# Push to main: the same checks, then a release that bumps the minor
# version. "Run workflow" in the Actions tab: a release that bumps the
# major version instead.
#
# A release builds the image, pushes it to Harbor as <version> and latest,
# and only then tags the commit vX.Y.Z, so a failed push leaves no tag and
# the next run tries the same version again.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version to bump
        type: choice
        options: [major, minor, patch]
        default: major

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: server
      # first, because it generates src/paraglide and the route tree that
      # the typecheck and the type-aware lint need
      - run: npm run build
      - run: npm run typecheck
      - run: npm run typecheck
        working-directory: server
      - run: npm run lint
      - run: npm run fmt:check

  image:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: check
    # Skipped until Harbor is set up: needs the HARBOR_REGISTRY and
    # HARBOR_PROJECT variables and the HARBOR_USERNAME and HARBOR_PASSWORD
    # secrets (Settings > Secrets and variables > Actions).
    if: github.event_name != 'pull_request' && vars.HARBOR_REGISTRY != ''
    # Set RELEASE_RUNNER to a self-hosted runner's label if Harbor is only
    # reachable from inside the homelab.
    runs-on: ${{ vars.RELEASE_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: write
    # one release at a time, so two quick pushes cannot pick the same number
    concurrency:
      group: release
      cancel-in-progress: false
    env:
      IMAGE: ${{ vars.HARBOR_REGISTRY }}/${{ vars.HARBOR_PROJECT }}/sebastians-me
    steps:
      - uses: actions/checkout@v4
        with:
          # the whole history and every tag, to find the latest version
          fetch-depth: 0

      - name: Work out the version
        id: version
        env:
          BUMP: ${{ inputs.bump || 'minor' }}
        run: |
          # A re-run of a commit that is already released keeps its version.
          existing=$(git tag --points-at HEAD --list 'v*.*.*' --sort=-v:refname | head -n1)
          if [ -n "$existing" ]; then
            echo "version=${existing#v}" >> "$GITHUB_OUTPUT"
            echo "new=false" >> "$GITHUB_OUTPUT"
            echo "$existing is already on this commit"
            exit 0
          fi

          latest=$(git tag --list 'v*.*.*' --sort=-v:refname | head -n1)
          IFS=. read -r major minor patch <<< "${latest#v}"
          major=${major:-0}; minor=${minor:-0}; patch=${patch:-0}
          case "$BUMP" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac
          next="$major.$minor.$patch"
          echo "version=$next" >> "$GITHUB_OUTPUT"
          echo "new=true" >> "$GITHUB_OUTPUT"
          echo "${latest:-no tag yet} -> v$next ($BUMP)"

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ vars.HARBOR_REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: VERSION=${{ steps.version.outputs.version }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Tag the commit
        if: steps.version.outputs.new == 'true'
        run: |
          git tag "v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"
